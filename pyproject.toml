[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aerofan"
version = "0.1.0"
description = "Fan control for the Gigabyte AERO 15 on Windows 11"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = []

[project.scripts]
aerofan-probe = "aerofan.probe:main"

[tool.setuptools.packages.find]
include = ["aerofan*"]
